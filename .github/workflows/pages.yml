name: Pubblica Zargo's Lords

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepara Godot 4.7
        run: |
          curl -fLsS https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64
          curl -fLsS https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.stable/"
      - name: Verifica le regole
        run: |
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --editor --quit
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tests/test_rules.gd
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tests/test_online_snapshot.gd
      - name: Configura Firebase per la build pubblica
        if: ${{ secrets.FIREBASE_DATABASE_URL != '' && secrets.FIREBASE_WEB_API_KEY != '' }}
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: |
          jq -n \
            --arg database_url "$FIREBASE_DATABASE_URL" \
            --arg api_key "$FIREBASE_WEB_API_KEY" \
            '{database_url: $database_url, api_key: $api_key}' > firebase_config.json
      - name: Esporta la build Web
        run: |
          mkdir -p build/web
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --export-release Web build/web/index.html
          touch build/web/.nojekyll
          test -s build/web/index.html
          test -s build/web/index.pck
          test -s build/web/index.wasm
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

